<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PhoneLab — A local iPhone automation lab</title>
  <desc id="desc">Windows observes an iPhone over USB. An ESP32 provides bounded BLE input. Observe, act, and verify.</desc>
